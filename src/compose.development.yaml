services:
  #### CATALOG ####
  catalog.database:
    image: postgres:16
    restart: always
    shm_size: 128mb
    container_name: catalog_database
    ports:
      - "${CATALOG_POSTGRES_PORT}:5432"
    volumes:
      - catalog_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${CATALOG_POSTGRES_PASSWORD}
      POSTGRES_USER: ${CATALOG_POSTGRES_USER}
      POSTGRES_DB: ${CATALOG_POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOG_POSTGRES_USER} -d ${CATALOG_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - catalog_network
  
  catalog.api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: eshop.services/catalog/Catalog.API
        PROJECT_NAME: Catalog.API
        SERVICE_API_PORT: ${CATALOG_API_PORT}
    image: catalog.api:dev
    container_name: catalog_api
    platform: linux/arm64/v8 
    volumes:
      - ./:/src:delegated
      - ~/.nuget/packages:/root/.nuget/packages:ro
    working_dir: /src
    ports:
      - "${CATALOG_API_PORT}:6060"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - ASPNETCORE_URLS=http://+:${CATALOG_API_PORT}
      - ConnectionStrings__CatalogConnection=Host=catalog.database;Port=${CATALOG_POSTGRES_PORT};Database=${CATALOG_POSTGRES_DB};Username=${CATALOG_POSTGRES_USER};Password=${CATALOG_POSTGRES_PASSWORD}
    depends_on:
      catalog.database:
        condition: service_healthy
    restart: on-failure
    networks:
      - catalog_network
        
  #### BASKET ####  
  basket.database:
    image: postgres:latest
    container_name: basket_database
    restart: always
    shm_size: 128mb
    ports:
      - "${BASKET_POSTGRES_PORT}:5432"
    volumes:
      - basket_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${BASKET_POSTGRES_PASSWORD}
      POSTGRES_USER: ${BASKET_POSTGRES_USER}
      POSTGRES_DB: ${BASKET_POSTGRES_DB}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${BASKET_POSTGRES_USER} -d ${BASKET_POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - basket_network

  basket.redis:
    image: redis:latest
    container_name: basket_redis
    restart: always
    ports:
      - "${BASKET_REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - basket_network

  basket.api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: eshop.services/basket/Basket.API
        PROJECT_NAME: Basket.API
        SERVICE_API_PORT: ${BASKET_API_PORT}
    image: basket.api:dev
    platform: linux/arm64/v8
    container_name: basket_api
    ports:
      - "6061:${BASKET_API_PORT}" #http
    environment:
      - ASPNETCORE_HTTP_PORTS=${BASKET_API_PORT}
      - ConnectionStrings__BasketConnection=Server=basket.database;Port=5432;Database=${BASKET_POSTGRES_DB};Username=${BASKET_POSTGRES_USER};Password=${BASKET_POSTGRES_PASSWORD}
      - ConnectionStrings__RedisConnection=basket.redis:6379
    depends_on:
      basket.database:
        condition: service_healthy
        required: true
        restart: true
      basket.redis:
        condition: service_healthy
        required: true
        restart: true
    volumes:
      - ./:/src:delegated
      - ~/.nuget/packages:/root/.nuget/packages:ro
    networks:
      - basket_network
        
        
  basket.redis-insight:
    image: redis/redisinsight:latest
    container_name: basket_redisinsight
    ports:
      - 5540:5540
    depends_on:
      basket.database:
        condition: service_healthy
        required: true
        restart: true
      basket.redis:
        condition: service_healthy
        required: true
        restart: true
    volumes:
      - redisinsight_data:/data
    networks:
      - basket_network
   
   
#### INFRA ####
volumes:
  catalog_data:
    name: catalog_data
  basket_data:
    name: basket_data
  redis_data:
    name: redis_data
  redisinsight_data:
    name: redisinsight_data


networks:
  catalog_network:
    name: catalog_network
  basket_network:
    name: basket_network 