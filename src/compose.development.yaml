services:
  catalog.database:
    image: postgres:16
    restart: always
    shm_size: 128mb
    ports:
      - "${CATALOG_POSTGRES_PORT}:5432"
    volumes:
      - catalog_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${CATALOG_POSTGRES_PASSWORD}
      POSTGRES_USER: ${CATALOG_POSTGRES_USER}
      POSTGRES_DB: ${CATALOG_POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOG_POSTGRES_USER} -d ${CATALOG_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  catalog.api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_PATH: eshop.services/catalog/Catalog.API
        PROJECT_NAME: Catalog.API
        SERVICE_API_PORT: ${CATALOG_API_PORT}
    image: catalog.api:dev
    platform: linux/arm64/v8 
    volumes:
      - ./:/src:delegated
      - ~/.nuget/packages:/root/.nuget/packages:ro
    working_dir: /src
    ports:
      - "${CATALOG_API_PORT}:6060"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - ASPNETCORE_URLS=http://+:${CATALOG_API_PORT}
      - ConnectionStrings__CatalogConnection=Host=catalog.database;Port=${CATALOG_POSTGRES_PORT};Database=${CATALOG_POSTGRES_DB};Username=${CATALOG_POSTGRES_USER};Password=${CATALOG_POSTGRES_PASSWORD}
    depends_on:
      catalog.database:
        condition: service_healthy
    restart: on-failure
   
volumes:
  catalog_data:
